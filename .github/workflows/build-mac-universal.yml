name: Build macOS Universal DMG

on:
  workflow_dispatch:
  push:
    branches:
      - codex/mac-universal-dmg

jobs:
  build:
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build universal DMG
        run: npm run build:mac:universal

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Bailongma-mac-universal
          path: dist/*mac-universal.dmg
          if-no-files-found: error
